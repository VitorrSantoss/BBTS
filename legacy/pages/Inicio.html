<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/telas/Inicio.css" />
    <title>Login</title>
  </head>
  <body>
    <div class="login-container">
      <div class="login-content">
        <!-- Logo -->
        <img src="/assets/images/Logo.png" alt="logo" class="logo" />

        <h1 class="login-title">LOGIN</h1>

        <!-- Email Input -->
        <div class="input-wrapper">
          <input type="email" class="input-field" placeholder="Email" />
          <svg class="input-icon" viewBox="0 0 24 24">
            <rect
              class="icon-stroke"
              x="3"
              y="5"
              width="18"
              height="14"
              rx="2"
            />
            <path class="icon-stroke" d="M3 7 L12 13 L21 7" />
          </svg>
        </div>

        <!-- Password Input -->
        <div class="input-wrapper">
          <input type="password" class="input-field" placeholder="Senha" />
          <svg class="input-icon" viewBox="0 0 24 24">
            <rect
              class="icon-stroke"
              x="5"
              y="11"
              width="14"
              height="10"
              rx="2"
            />
            <path class="icon-stroke" d="M7 11 V7 A5 5 0 0 1 17 7 V11" />
          </svg>
        </div>

        <!-- Botão Entrar -->
        <button class="btn-entrar" onclick="location.href='TelaCadastro.html'">
          ENTRAR
        </button>

        <!-- Links -->
        <div class="links-section">
          <a href="#" class="forgot-password">Esqueci a senha</a>
          <span class="no-account">Não possui uma conta?</span>
          <a href="/pages/TelaCadastro.html" class="register-link"
            >CADASTRE-SE</a
          >
        </div>
      </div>
    </div>
  </body>
</html>
