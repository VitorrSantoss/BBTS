<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-M" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dados de Colaborador</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/telas/TelaCadastro.css" />
  </head>

  <body class="bg-fundo min-h-screen flex flex-col">
    <div class="w-full h-6 bg-secundaria"></div>

    <main class="flex flex-grow" style="min-height: calc(100vh - 1.5rem)">
      <!-- Coluna principal -->
      <div class="form-col w-full lg:w-3/4 p-8 md:p-12 lg:p-16">
        <header class="flex items-center mb-10">
          <div
            class="bg-principal p-3 rounded-lg flex items-center justify-center"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              fill="#fcfc30"
              viewBox="0 0 256 256"
            >
              <path
                d="M208,32H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32Zm0,16V88H48V48ZM48,208V104H208V208Z"
              ></path>
            </svg>
          </div>
          <h1
            class="text-4xl lg:text-5xl font-bold text-principal ml-4 font-calibri"
          >
            Dados de Colaborador
          </h1>
        </header>

        <form class="space-y-10 pb-32">
          <!-- Dados pessoais -->
          <section>
            <h2 class="text-2xl font-bold text-principal mb-4 font-calibri">
              Dados Pessoais
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:items-start">
              <input
                type="text"
                placeholder="Nome completo"
                class="form-input"
              />
              <input
                type="date"
                placeholder="Data de nascimento"
                class="form-input"
              />
              <input
                type="tel"
                placeholder="Telefone (Ex: (DDD) 99999-9999)"
                class="form-input"
              />
              <input type="email" placeholder="E-mail" class="form-input" />
              <input type="password" placeholder="Senha" class="form-input" />

              <section>
                <h2 class="text-2xl font-bold text-principal mb-4 font-calibri">
                  Idiomas
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <input
                    type="text"
                    placeholder="Idioma (Ex: Inglês)"
                    class="form-input"
                  />
                  <select class="form-input">
                    <option value="" disabled selected>
                      Nível (Ex: Iniciante)
                    </option>
                    <option value="iniciante">Iniciante</option>
                    <option value="basico">Básico</option>
                    <option value="intermediario">Intermediário</option>
                    <option value="avancado">Avançado</option>
                    <option value="fluente">Fluente / Nativo</option>
                  </select>
                </div>
                <a
                  href="#"
                  class="text-link font-semibold mt-3 inline-block text-sm"
                  >+ Adicionar idioma</a
                >
              </section>
              
            </div>
          </section>

          <!-- Experiência Profissional -->
          <section>
            <h2 class="text-2xl font-bold text-principal mb-4 font-calibri">
              Experiência Profissional
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <input type="text" placeholder="Empresa" class="form-input" />
              <input
                type="text"
                placeholder="Cargo (Ex: Desenvolvedor Júnior)"
                class="form-input"
              />
              <div class="flex items-center gap-2 md:col-span-2">
                <input id="empregoAtual" type="checkbox" class="w-5 h-5" />
                <label for="empregoAtual" class="text-gray-700 text-sm"
                  >Emprego atual</label
                >
              </div>
              <input type="month" placeholder="Início" class="form-input" />
              <input type="month" placeholder="Fim" class="form-input" />
              <textarea
                placeholder="Descrição das atividades e conquistas"
                class="form-textarea md:col-span-2"
              ></textarea>
            </div>
            <a
              href="#"
              class="text-link font-semibold mt-3 inline-block text-sm"
              >+ Adicionar experiência</a
            >
          </section>

          <!-- Certificações -->
          <section>
            <h2 class="text-2xl font-bold text-principal mb-4 font-calibri">
              Certificações
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <input
                type="text"
                placeholder="Nome do curso"
                class="form-input"
              />
              <input
                type="date"
                placeholder="Data do certificado"
                class="form-input"
              />
              <input
                type="file"
                accept="application/pdf"
                class="form-input md:col-span-2"
              />
            </div>
            <a
              href="#"
              class="text-link font-semibold mt-3 inline-block text-sm"
              >+ Adicionar certificação</a
            >
          </section>

          <button
            type="submit"
            class="bg-secundaria text-principal font-bold text-xl py-3 px-12 rounded-full shadow-md hover:bg-yellow-300 transition-colors"
          >
            SALVAR
          </button>
        </form>
      </div>

      <!-- Coluna lateral -->
      <aside
        class="w-full lg:w-1/4 bg-principal flex flex-col items-center justify-between p-8 lg:py-16"
        style="min-height: 500px"
      >
        <div class="flex flex-col items-center text-center">
          <div
            class="bg-white rounded-full w-40 h-40 flex items-center justify-center border-2 border-white shadow-lg overflow-hidden"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 448 512"
              class="w-3/4 h-3/4 fill-current text-gray-400 opacity-75"
            >
              <path
                d="M224 256A128 128 0 1 0 224 0a128 128 0 1 0 0 256zm-45.7 48C79.8 304 0 383.8 0 482.3C0 498.7 13.3 512 29.7 512H418.3c16.4 0 29.7-13.3 29.7-29.7C448 383.8 368.2 304 269.7 304H178.3z"
              />
            </svg>
          </div>
          <p class="text-white text-2xl font-bold mt-6">
            Adicione uma foto de perfil
          </p>
        </div>

        <button
          type="button"
          class="bg-secundaria text-principal font-bold text-xl py-3 px-12 rounded-full shadow-md hover:bg-yellow-300 transition-colors"
        >
          VOLTAR
        </button>
      </aside>
    </main>
  </body>
</html>
