<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/css/telas/SelecaoPerfil.css" />
  </head>
  <body>
    <div class="SELEO-DE-PERFIL">
      <div class="navbar-blue"></div>
      <div class="group">
        <img class="logo-hotbar" src="/assets/images/LogoBBTS.png" />
        <div class="div">
          <div class="group-wrapper">
            <div class="group-2">
              <div class="gg-profile">
                <div class="group-3">
                  <img class="img" src="/assets/images/foto_perfil.png" />
                </div>
              </div>
              <div class="group-4">
                <div class="div-wrapper">
                  <div class="group-5">
                    <div class="rectangle"></div>
                    <div class="text-wrapper">
                      <button
                        type="submit"
                        class="btn btn-primary"
                        onclick="location.href='TelaColaborador.html'"
                      >
                        COLABORADOR
                      </button>
                    </div>
                  </div>
                </div>
                <div class="div-wrapper">
                  <div class="group-5">
                    <div class="rectangle"></div>
                    <div class="text-wrapper-2"><button
                        type="submit"
                        class="btn btn-primary"
                        onclick="location.href='TelaColaboradorGestor.html'"
                      >
                        GESTOR
                      </button></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <p class="p">Qual tipo de perfil deseja acessar?</p>
        </div>
      </div>
    </div>
  </body>
</html>
